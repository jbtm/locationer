# In den bestehenden server-Block von tools.cronica.ch einfuegen
# (/etc/nginx/sites-enabled/tools), neben /curator/.
    location /locationer/ {
        proxy_pass http://127.0.0.1:5006/;          # der abschliessende / entfernt den Praefix
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /locationer;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 400M;                  # DISCO-Liste: 190 MB
        proxy_read_timeout 600s;                    # Upload grosser Dateien, /api/orte
        proxy_request_buffering off;
    }
